name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      # This allow GitHub Actions to trigger the jobs for tags if needed
      - name: Generate token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Release or create release PR
        id: changesets
        uses: changesets/action@v2
        with:
          # The app token is required so that the pushed release commit and tags trigger other workflows (e.g. the Docker build)
          github-token: ${{ steps.app-token.outputs.token }}
          # This expects you to have a script called release which does a build for your packages and calls changeset git-tag
          publish-script: npm run release
          commit-message: "chore: release"
          pr-title: "Merge to release"
